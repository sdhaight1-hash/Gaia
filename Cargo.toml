[package]
name = "gaia"
default-run = "gaia"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Independent node-based terrain editor"

[dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["wgpu", "default_fonts", "x11"] }
bytemuck = { version = "1.23", features = ["derive"] }
glam = "0.30"
png = "0.17"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
pollster = "0.4"

[profile.release]
lto = "thin"
